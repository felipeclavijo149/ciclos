<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplos de ciclos</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header>
    <a href="index.html">← Volver al menú</a>
    <h1>Ejemplos de ciclos</h1>
    <p>Practica con for, while y do...while</p>
  </header>

  <main>
    <section class="controles">
      <h2>Tabla de multiplicar</h2>
      <form id="formTabla">
        <label for="numeroTabla">Número para la tabla:</label>
        <input type="number" id="numeroTabla" step="1" required>
        <button type="submit">Generar tabla</button>
      </form>
      <ul id="listaTabla"></ul>
    </section>

    <section class="controles">
      <h2>Plan de ahorro</h2>
      <form id="formAhorro">
        <label for="ahorroMensual">Ahorro mensual:</label>
        <input type="number" id="ahorroMensual" step="any" required>
        <label for="meta">Meta de ahorro:</label>
        <input type="number" id="meta" step="any" required>
        <button type="submit">Calcular meses</button>
      </form>
      <p id="resultadoAhorro"></p>
    </section>

    <section class="controles">
      <h2>Lanzamiento de dado</h2>
      <form id="formDado">
        <label for="objetivo">Número del dado que buscas (1 a 6):</label>
        <input type="number" id="objetivo" min="1" max="6" required>
        <button type="submit">Lanzar dado</button>
      </form>
      <p id="resultadoDado"></p>
      <ul id="listaDado"></ul>
    </section>
  </main>

  <script src="js/ejemplo-for.js"></script>
  <script src="js/ejemplo-while.js"></script>
  <script src="js/ejemplo-do-while.js"></script>
</body>
</html>
